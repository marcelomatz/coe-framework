<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="nui://coe_ui/html/tokens.css">
	<link rel="stylesheet" href="nui://coe_ui/html/components.css">
	<script src="nui://coe_ui/html/components.js"></script>
	<link rel="stylesheet" href="mobile.css">
</head>
<body>
	<!-- Telefone básico: um aparelho no canto da tela. As telas (início, apps e ligação) são montadas por mobile.js. -->
	<main id="phone" class="mb" hidden aria-label="Telefone">
		<div class="mb-device">
			<div id="mb-screen" class="mb-screen" data-wallpaper="padrao">
				<header class="mb-statusbar">
					<span id="mb-clock" class="mb-clock">--:--</span>
					<span class="mb-notch" aria-hidden="true"></span>
					<span class="mb-signal" aria-hidden="true">
						<svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4"/><rect x="5" y="5" width="3" height="7"/><rect x="10" y="2" width="3" height="10"/><rect x="15" y="0" width="3" height="12" opacity=".35"/></svg>
						<svg viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="20" height="11" rx="2" fill="none" stroke="currentColor"/><rect x="2.5" y="2.5" width="13" height="7" rx="1"/><rect x="21.5" y="4" width="2" height="4" rx="1"/></svg>
					</span>
				</header>
				<section id="mb-view" class="mb-view"></section>
				<section id="mb-call" class="mb-call" hidden aria-live="assertive"></section>
				<p id="mb-toast" class="mb-toast" role="status" aria-live="polite" hidden></p>
				<footer class="mb-homebar">
					<button id="mb-home" class="mb-homebutton" type="button" aria-label="Início"></button>
				</footer>
			</div>
		</div>
		<p id="mb-hint" class="mb-hint" hidden></p>
	</main>
	<script src="mobile.js"></script>
</body>
</html>
