name: COE Framework CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Lua
        uses: hishamhm/gh-actions-lua@v8
        with:
          luaVersion: "5.4"

      - name: Validate Contracts and Platform HAL
        run: |
          lua tools/check_contracts.lua

      - name: Run Smoke Boot Suite
        run: |
          lua tools/smoke_boot_test.lua
