# Capacidades (ACE) para scripts de TERCEIROS no COE Framework.
#
# Os resources do próprio framework (base e scripts avançados) já têm o acesso de que precisam: a base pelas
# allowlists padrão de cada resource e os avançados por CoeAccess.FirstParty (coe_core/lib/access.lua) e pela
# allowlist do coe_database. Nada aqui é necessário para o framework funcionar.
#
# Um script seu que use capacidades protegidas recebe a ACE no principal dele. Coloque as linhas DIRETO no
# server.cfg, antes dos ensure (um `exec` com caminho relativo depende da pasta de trabalho do FXServer, que muda
# conforme a hospedagem e o txAdmin):
#
#   add_ace resource.meu_script coe.database allow           # banco (coe_database)
#   add_ace resource.meu_script coe.logging allow            # logs estruturados (coe_logging)
#   add_ace resource.meu_script coe.notify allow             # notificações (coe_notify)
#   add_ace resource.meu_script coe.audit allow              # auditoria (coe_audit)
#   add_ace resource.meu_script coe.economy.money allow      # saldo, crédito e débito (coe_economy)
#   add_ace resource.meu_script coe.businesses.extend allow  # provedores no app do negócio (coe_businesses)
#
# Lista completa das capacidades: docs/ARCHITECTURE.md (Contratos e Exports Públicos).
