$engine: 3
$onesync: on

name: "COE Framework - FiveM Enhanced Gen9"
version: "0.1.0-beta.18"
author: "COE Roleplay Team"
description: "Framework nativo FiveM Enhanced Gen9 (DX12) de ultra-baixa latência (<0.08ms) com 50 recursos integrados, HUD vetorial, inventário por slots, supervisor de boot e banco assíncrono."

tasks:
  # 1. Download official CitizenFX default server data (chat, spawnmanager, baseevents, etc.)
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]

  # 2. Remove obsolete legacy gamemodes and maps (fivem-map-hipster / skater) that conflict on boot
  - action: remove_path
    path: ./resources/[cfx-default]/[gamemodes]

  # 3. Download COE Framework open-source resources
  - action: download_github
    src: https://github.com/marcelomatz/coe-framework
    ref: main
    dest: ./resources/[coe-framework]

  # 4. Remove pastas de documentação e CLI para evitar ruído no scanner de resources do FXServer
  - action: remove_path
    path: ./resources/[coe-framework]/reference

  - action: remove_path
    path: ./resources/[coe-framework]/tools

  # 4b. Básicos que têm script avançado ficam de fora (o avançado faz o upgrade e importa os dados do básico)
  - action: remove_path
    path: ./resources/[coe-framework]/coe_bank
  - action: remove_path
    path: ./resources/[coe-framework]/coe_garage
  - action: remove_path
    path: ./resources/[coe-framework]/coe_mobile
  - action: remove_path
    path: ./resources/[coe-framework]/coe_staff
  - action: remove_path
    path: ./resources/[coe-framework]/coe_workpad

  # 5. Connect to Database (auto creates the database if not existing)
  - action: connect_database

  # 6. Generate optimized server.cfg
  - action: write_file
    file: server.cfg
    data: |
      ## ====================================================================
      ## COE Framework - FiveM Enhanced Gen9 / DX12 Dedicated Server
      ## Official txAdmin Deployment Configuration (Recipe Engine v3)
      ## Website: https://www.coeroleplay.app | Docs: https://docs.coeroleplay.app
      ## ====================================================================

      ## Endpoints do Servidor (Gerenciado pelo txAdmin)
      {{serverEndpoints}}
      sv_maxclients {{maxClients}}

      ## Informações do Servidor
      sv_hostname "{{serverName}} | COE Framework Gen9 DX12"
      sets sv_projectName "{{serverName}}"
      sets sv_projectDesc "Servidor FiveM Enhanced Gen9 alimentado por COE Framework"
      sets locale "pt-BR"
      sets tags "coe, enhanced, gen9, dx12, roleplay, rp, brasil, optimized"

      ## Chave de Licença Cfx.re (Gerenciada pelo txAdmin)
      sv_licenseKey "{{svLicense}}"

      ## OneSync & FiveM Enhanced Settings (DX12 / Gen9)
      onesync on
      set sv_entityLockdown "full"
      set sv_syncTickRate 60

      ## Sistema de Voz 3D Nativo Enhanced (Zero-lag interno)
      voice_internal
      setr voice_useNativeAudio true
      setr voice_use3dAudio true
      setr voice_useSendingRangeOnly true
      setr voice_enableUi 0

      ## Configurações Operacionais COE
      set coe_logging_level "info"

      ## Configuração do Banco de Dados MySQL / MariaDB
      set mysql_connection_string "{{dbConnectionString}}"
      set coe_database_host "{{dbHost}}"
      set coe_database_port {{dbPort}}
      set coe_database_user "{{dbUsername}}"
      set coe_database_password "{{dbPassword}}"
      set coe_database_name "{{dbName}}"
      set coe_database_connection_limit 20
      set coe_database_ssl false

      ## Permissões de Administrador txAdmin
      add_ace group.admin command allow
      add_ace group.admin command.quit deny
      {{addPrincipalsMaster}}

      ## Permissões da Staff (coe_admin). As ACEs coe.staff.* antigas continuam valendo.
      ## Módulos por grupo (opcional): coe_admin.tools.<módulo>; acesso total: coe_admin.root
      add_ace group.admin coe.staff.all allow
      add_ace group.admin coe_admin.tools.all allow
      add_ace group.admin coe_admin.root allow

      ## Scripts de terceiros que usem capacidades do framework: add_ace resource.<script> <capacidade> allow
      ## (aqui, antes dos ensure). Os resources do COE já têm o acesso de que precisam.

      ## --------------------------------------------------------------------
      ## Recursos Base do CitizenFX
      ## --------------------------------------------------------------------
      ensure chat
      ensure spawnmanager
      ensure baseevents

      ## --------------------------------------------------------------------
      ## Permissões de Sistema de Arquivos (COE Auto-Updater / Supervisor)
      ## Permite ao coe_supervisor aplicar atualizações diretamente nos resources
      ## --------------------------------------------------------------------
      add_filesystem_permission coe_supervisor write coe_admin
      add_filesystem_permission coe_supervisor write coe_amzg
      add_filesystem_permission coe_supervisor write coe_appearance
      add_filesystem_permission coe_supervisor write coe_apps
      add_filesystem_permission coe_supervisor write coe_audit
      add_filesystem_permission coe_supervisor write coe_banking
      add_filesystem_permission coe_supervisor write coe_businesses
      add_filesystem_permission coe_supervisor write coe_characters
      add_filesystem_permission coe_supervisor write coe_core
      add_filesystem_permission coe_supervisor write coe_crafting
      add_filesystem_permission coe_supervisor write coe_crypto
      add_filesystem_permission coe_supervisor write coe_database
      add_filesystem_permission coe_supervisor write coe_deepweb
      add_filesystem_permission coe_supervisor write coe_dispatch
      add_filesystem_permission coe_supervisor write coe_doors
      add_filesystem_permission coe_supervisor write coe_economy
      add_filesystem_permission coe_supervisor write coe_elos
      add_filesystem_permission coe_supervisor write coe_ems
      add_filesystem_permission coe_supervisor write coe_factions
      add_filesystem_permission coe_supervisor write coe_fuel
      add_filesystem_permission coe_supervisor write coe_garages
      add_filesystem_permission coe_supervisor write coe_handling
      add_filesystem_permission coe_supervisor write coe_housing
      add_filesystem_permission coe_supervisor write coe_hud
      add_filesystem_permission coe_supervisor write coe_inventory
      add_filesystem_permission coe_supervisor write coe_jobs
      add_filesystem_permission coe_supervisor write coe_loadscreen
      add_filesystem_permission coe_supervisor write coe_logging
      add_filesystem_permission coe_supervisor write coe_loot
      add_filesystem_permission coe_supervisor write coe_mail
      add_filesystem_permission coe_supervisor write coe_map
      add_filesystem_permission coe_supervisor write coe_mdt
      add_filesystem_permission coe_supervisor write coe_mechanic
      add_filesystem_permission coe_supervisor write coe_needs
      add_filesystem_permission coe_supervisor write coe_news
      add_filesystem_permission coe_supervisor write coe_notify
      add_filesystem_permission coe_supervisor write coe_phone
      add_filesystem_permission coe_supervisor write coe_police
      add_filesystem_permission coe_supervisor write coe_races
      add_filesystem_permission coe_supervisor write coe_rentals
      add_filesystem_permission coe_supervisor write coe_shops
      add_filesystem_permission coe_supervisor write coe_spawn
      add_filesystem_permission coe_supervisor write coe_supervisor
      add_filesystem_permission coe_supervisor write coe_tablet
      add_filesystem_permission coe_supervisor write coe_talk
      add_filesystem_permission coe_supervisor write coe_telecom
      add_filesystem_permission coe_supervisor write coe_ui
      add_filesystem_permission coe_supervisor write coe_vehicle_catalog
      add_filesystem_permission coe_supervisor write coe_vehicles
      add_filesystem_permission coe_supervisor write coetarget

      ## --------------------------------------------------------------------
      ## Ordem Estrita de Boot - COE Framework
      ## Supervisor e Core devem iniciar antes dos subsistemas
      ## --------------------------------------------------------------------
      ensure coe_supervisor
      ensure coe_logging
      ensure coe_database
      ensure coe_core

      ## Subsistemas e Interface
      ensure coe_ui
      ensure coetarget
      ensure coe_audit
      ensure coe_notify
      ensure coe_loadscreen

      ## Gameplay e Vida da Cidade
      ensure coe_characters
      ensure coe_spawn
      ensure coe_appearance
      ensure coe_hud
      ensure coe_needs
      ensure coe_inventory
      ensure coe_map
      ensure coe_talk
      ensure coe_businesses
      ensure coe_economy
      ensure coe_shops
      ensure coe_jobs
      ensure coe_vehicle_catalog
      ensure coe_vehicles
      ensure coe_rentals

      ## Dependências de terceiros (vêm em [coe-framework]/[vendor])
      ensure screenshot-basic

      ## Scripts avançados (telefone, tablet, banco, admin, polícia, EMS, DeepWeb...)
      ensure coe_admin
      ensure coe_amzg
      ensure coe_apps
      ensure coe_banking
      ensure coe_crafting
      ensure coe_crypto
      ensure coe_deepweb
      ensure coe_dispatch
      ensure coe_doors
      ensure coe_elos
      ensure coe_ems
      ensure coe_factions
      ensure coe_fuel
      ensure coe_garages
      ensure coe_handling
      ensure coe_housing
      ensure coe_loot
      ensure coe_mail
      ensure coe_mdt
      ensure coe_mechanic
      ensure coe_news
      ensure coe_phone
      ensure coe_police
      ensure coe_races
      ensure coe_tablet
      ensure coe_telecom
