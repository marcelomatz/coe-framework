<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Garagem Pública</title>
	<link rel="stylesheet" href="nui://coe_ui/html/tokens.css">
	<link rel="stylesheet" href="nui://coe_ui/html/components.css">
	<link rel="stylesheet" href="nui://coe_ui/html/perspective.css">
	<link rel="stylesheet" href="nui://coe_ui/html/prompt.css">
	<link rel="stylesheet" href="garage.css">
</head>
<body>
	<div id="garage-modal" class="coe-modal-overlay" hidden>
		<section class="coe-modal garage-card" role="dialog" aria-labelledby="garage-title">
			<header class="garage-header">
				<div class="garage-heading">
					<h2 id="garage-title" class="garage-title">Garagem Pública</h2>
					<p id="garage-subtitle" class="garage-subtitle">Selecione o veículo que deseja retirar</p>
				</div>
				<button id="garage-close" type="button" class="coe-button garage-close" aria-label="Fechar">✕</button>
			</header>
			<div id="vehicle-list" class="garage-list"></div>
		</section>
	</div>

	<script src="nui://coe_ui/html/prompt.js"></script>
	<script src="nui://coe_ui/html/components.js"></script>
	<script src="garage.js"></script>
</body>
</html>
